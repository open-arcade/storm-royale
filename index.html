<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">

.bar{position:relative;height:20px;background:#000a;border:2px solid #fff3;border-radius:10px;overflow:hidden;margin:4px 0}

#hp i{background:linear-gradient(#86efac,#16a34a)}#sh i{background:linear-gradient(#7dd3fc,#0284c7)}
#wc{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px;width:max-content;max-width:96vw;position:relative;left:50%;transform:translateX(-50%)}
#wn,#wd{padding:5px 12px;border-radius:10px;background:#000b;border:2px solid #fff3;font:400 15px var(--f);color:#fff}

#wi{width:56px;height:22px}
#wp{display:flex;gap:4px}

@keyframes fi{from{transform:translateX(-24px);opacity:0}}

#bb{display:none;position:fixed;right:calc(env(safe-area-inset-right,0px) + 24px);bottom:calc(env(safe-area-inset-bottom,0px) + 200px);width:76px;height:76px;border-radius:50%;border:3px solid #fff;background:#facc15;color:#422006;font:400 16px var(--f);box-shadow:0 5px 0 #b45309}

</style></head><body>

<div id="set" style="display:none"><h4>Settings</h4>

<div id="bars"><div class="bar" id="sh"><i></i><b></b></div><div class="bar" id="hp"><i></i><b></b></div><div id="wc"><button id="wn" tabindex="-1"><canvas id="wi" width="112" height="44"></canvas><span id="wt"></span><span id="wp"></span><span id="wk">TAB</span></button><span id="wd"><canvas id="wdi" width="44" height="44"></canvas><b id="wdn"></b></span></div></div>

<div id="mcards">
<button class="mc br" data-m="br"><svg viewBox="0 0 120 70"><circle cx="60" cy="35" r="31" fill="#7e22ce33" stroke="#c084fc" stroke-width="3" stroke-dasharray="6 4"/><circle cx="60" cy="35" r="18" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3 3" opacity=".7"/><circle cx="60" cy="35" r="7" fill="#facc15" stroke="#fff" stroke-width="2"/><rect x="63" y="33" width="14" height="4" rx="1" fill="#9ca3af"/><circle cx="24" cy="18" r="4" fill="#ef4444"/><circle cx="98" cy="50" r="4" fill="#06b6d4"/><circle cx="30" cy="54" r="4" fill="#a3e635"/></svg><b>BATTLE ROYALE</b><span>24 bots, one winner. Loot, build and outlast the storm.</span><em>SOLO</em></button>
<button class="mc ko" data-m="ko"><svg viewBox="0 0 120 70"><rect x="52" y="22" width="16" height="26" rx="2" fill="#c08a4b" stroke="#3b210a" stroke-width="2"/><path d="M52 22L68 48M68 22L52 48" stroke="#6b4423" stroke-width="2"/><g fill="#3b82f6" stroke="#fff" stroke-width="1.5"><circle cx="14" cy="14" r="5"/><circle cx="26" cy="26" r="5"/><circle cx="12" cy="36" r="5"/><circle cx="26" cy="47" r="5"/><circle cx="14" cy="58" r="5"/></g><g fill="#ef4444" stroke="#fff" stroke-width="1.5"><circle cx="106" cy="14" r="5"/><circle cx="94" cy="26" r="5"/><circle cx="108" cy="36" r="5"/><circle cx="94" cy="47" r="5"/><circle cx="106" cy="58" r="5"/></g><path d="M33 26H47M87 47H73" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round"/></svg><b>KNOCKOUT</b><span>5v5 warehouse paintball. Wipe out the other team. Three rounds.</span><em>5 v 5 · 3 ROUNDS</em></button>
<button class="mc ctf" data-m="ctf"><svg viewBox="0 0 120 70"><ellipse cx="22" cy="58" rx="16" ry="5" fill="#3b82f6" opacity=".7"/><ellipse cx="98" cy="58" rx="16" ry="5" fill="#ef4444" opacity=".7"/><rect x="57" y="10" width="4" height="48" fill="#e5e7eb"/><path d="M61 12L94 22L61 34Z" fill="#ef4444" stroke="#fff" stroke-width="1.5"/><circle cx="36" cy="44" r="5" fill="#3b82f6" stroke="#fff" stroke-width="1.5"/><path d="M42 44H52" stroke="#fde68a" stroke-width="2.5" stroke-linecap="round"/><circle cx="84" cy="48" r="5" fill="#ef4444" stroke="#fff" stroke-width="1.5"/></svg><b>CAPTURE THE FLAG</b><span>5v5. Steal the enemy flag and carry it to your base. First to 3.</span><em>5 v 5 · FIRST TO 3</em></button>
</div></div></div>
<script>
const $=id=>document.getElementById(id),cv=$('g'),c=cv.getContext('2d'),m2=$('mm').getContext('2d');
const W=3200,TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const WP=[{n:'Pistol',g:'P',len:30,x0:10,c:'#9ca3af',d:14,rate:.35,spd:950,rng:620,spr:.04,pel:1},{n:'Assault Rifle',g:'R',len:46,x0:2,c:'#3b82f6',d:11,rate:.11,spd:1050,rng:720,spr:.06,pel:1},{n:'Shotgun',g:'G',len:49,x0:2,c:'#f97316',d:10,rate:.85,spd:900,rng:380,spr:.2,pel:6},{n:'Sniper',g:'N',len:59,x0:0,c:'#a855f7',d:75,rate:1.3,spd:1900,rng:1300,spr:.004,pel:1}];
const RK=[0,3,2,1],PH=[{r:1500,hold:30,shr:25,dps:1},{r:950,hold:25,shr:20,dps:2},{r:550,hold:20,shr:18,dps:4},{r:280,hold:18,shr:15,dps:6},{r:100,hold:15,shr:15,dps:9},{r:0,hold:5,shr:12,dps:12}];
const NAMES='Rex Nova Blaze Ghost Pixel Viper Echo Zed Mav Luna Atlas Fang Jinx Riot Sage Onyx Drift Kilo Moxie Pyro Quill Rook Tango Wraith'.split(' ');
const COLS=['#ef4444','#f97316','#a3e635','#06b6d4','#8b5cf6','#ec4899','#14b8a6','#e5e7eb'];
let FX=[],shake=0,by='',P,B,walls,trees,houses,pk,me,S,T,run=false,over=false,place=25,feed=[],cw,ch,sc,dpr,wantBuild=false,mouseMode=false;
const AU=(()=>{
 let ctx=null,sfxG,musG,nb,seq=null,rt=null,act=0,lastW=0,cnt=true;const on={sfx:true,mus:true};
 try{const s=JSON.parse(localStorage.getItem('sr_audio')||'{}');if(s.sfx===false)on.sfx=false;if(s.mus===false)on.mus=false}catch(e){}
 const store=()=>{try{localStorage.setItem('sr_audio',JSON.stringify(on))}catch(e){}};
 const mi=m=>440*Math.pow(2,(m-69)/12),ovVis=()=>$('ov').style.display!=='none';
 const trk=n=>{if(cnt){act++;n.onended=()=>act--}};
 function init(){if(ctx)return true;const A=window.AudioContext||window.webkitAudioContext;if(!A)return false;
  try{ctx=new A()}catch(e){return false}
  const comp=ctx.createDynamicsCompressor();comp.connect(ctx.destination);
  sfxG=ctx.createGain();sfxG.gain.value=.8;sfxG.connect(comp);musG=ctx.createGain();musG.gain.value=.55;musG.connect(comp);
  nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return true}
 const ok=()=>ctx&&on.sfx&&ctx.state==='running';
 const dst=p=>{if(!p||!ctx.createStereoPanner)return sfxG;const n=ctx.createStereoPanner();n.pan.value=clamp(p,-1,1);n.connect(sfxG);return n};
 const sp=(x,y,r)=>{if(typeof me==='undefined'||!me||x===undefined)return[1,0];const dx=x-me.x,dy=y-me.y,d=Math.hypot(dx,dy);if(d>=r)return[0,0];const k=1-d/r;return[k*k,dx/450]};
 // building blocks
 function osc(type,f0,f1,t,dur,vol,d){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(d);o.start(t);o.stop(t+dur+.03);trk(o)}
 function nz(t,dur,vol,ft,f0,f1,q,d){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nb;s.loop=true;f.type=ft;f.frequency.setValueAtTime(f0,t);if(f1!==f0)f.frequency.exponentialRampToValueAtTime(f1,t+dur);f.Q.value=q;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(d);s.start(t,Math.random());s.stop(t+dur+.03);trk(s)}
 function nt(type,f,t,dur,vol,d,glide){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(glide)o.frequency.linearRampToValueAtTime(glide,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.setValueAtTime(vol,t+Math.max(.013,dur*.6));g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(d);o.start(t);o.stop(t+dur+.03);trk(o)}
 const lp=(f,to)=>{const b=ctx.createBiquadFilter();b.type='lowpass';b.frequency.value=f;b.connect(to);return b};
 // ---- sound effects
 function gun(i,x,y,mine){if(!ok()||act>40)return;const[v,pan]=mine?[1,0]:sp(x,y,1100);if(v<.04)return;const t=ctx.currentTime,d=dst(pan),m=v*(mine?1:.8);
  if(i===0){nz(t,.09,.5*m,'bandpass',2500,900,.8,d);osc('square',520,90,t,.09,.25*m,d)}
  else if(i===1){nz(t,.07,.45*m,'bandpass',3200,1200,.7,d);osc('sawtooth',380,80,t,.07,.22*m,d)}
  else if(i===2){nz(t,.28,.9*m,'lowpass',3500,300,.5,d);osc('sine',140,40,t,.22,.7*m,d);nz(t+.02,.12,.4*m,'highpass',1500,1500,.5,d)}
  else{nz(t,.5,.9*m,'lowpass',5000,200,.4,d);osc('sine',110,30,t,.45,.9*m,d);nz(t,.05,.7*m,'highpass',3000,3000,.5,d);osc('triangle',1800,300,t,.12,.25*m,d);nz(t+.2,.4,.22*m,'lowpass',1500,200,.4,d)}}
 function hit(x,y,mine,sh,dealt){if(!ok()||act>45)return;const t=ctx.currentTime;
  if(dealt){osc('square',1300,900,t,.05,.16,sfxG)}
  if(mine){if(sh)osc('sine',1500,900,t,.18,.3,sfxG);osc('sine',170,55,t,.14,.7,sfxG);nz(t,.08,.35,'lowpass',900,300,.6,sfxG)}
  else{const[v,pan]=sp(x,y,800);if(v<.05)return;const d=dst(pan);if(sh)osc('sine',1500,900,t,.15,.25*v,d);nz(t,.05,.35*v,'bandpass',1800,900,.8,d);osc('triangle',260,120,t,.07,.3*v,d)}}
 function oof(x,y,mine){if(!ok())return;const[v,pan]=mine?[1,0]:sp(x,y,900);if(v<.05)return;const t=ctx.currentTime,d=dst(pan),base=mine?200:150+Math.random()*90,vol=.55*v;
  const o=ctx.createOscillator(),g=ctx.createGain(),b1=ctx.createBiquadFilter(),b2=ctx.createBiquadFilter();
